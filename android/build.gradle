buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.0.0" // Verifique a versão correta para o plugin do Android
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0" // Versão do Kotlin Gradle Plugin
        // Outras dependências de classpath, se necessário
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}


