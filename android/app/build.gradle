//apply plugin: 'com.google.gms.google-services'

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "br.com.papapreco"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "br.com.papapreco"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Signing credentials come from android/key.properties, which is gitignored
    // and so is absent on a fresh clone. That case fails the release build
    // rather than falling back to debug signing — `gradlew :app:signingReport`
    // on a tree without the file reports `Config: release, Store: null`, not
    // `Config: debug`. That is the wanted behaviour: a release APK signed with
    // the debug key installs and runs, and then fails Google Sign-In on every
    // device except the one that built it, which is the hardest class of bug to
    // attribute. Debug builds are unaffected and need no keystore.
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
        debug {
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.2.0')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

